<!DOCTYPE html>
<html>
<head>
    <title>GitHub Cache Viewer</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #00ff00;
        }
        pre {
            background: #000;
            padding: 15px;
            border: 1px solid #00ff00;
            overflow: auto;
        }
        button {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #00cc00;
        }
    </style>
</head>
<body>
    <h1>GitHub LocalStorage Cache Viewer</h1>
    <button onclick="viewCache()">View Cache</button>
    <button onclick="clearCache()">Clear Cache</button>
    <button onclick="checkEnv()">Check Environment</button>
    <div id="output"></div>

    <script>
        function viewCache() {
            const keys = [
                'github_profile',
                'github_repos',
                'github_languages',
                'github_stats',
                'github_contributions',
                'github_last_sync',
                'github_sync_status'
            ];

            let output = '<h2>GitHub Cache Contents:</h2>';

            keys.forEach(key => {
                const value = localStorage.getItem(key);
                if (value) {
                    output += `<h3>${key}:</h3>`;
                    try {
                        const parsed = JSON.parse(value);
                        output += `<pre>${JSON.stringify(parsed, null, 2)}</pre>`;
                    } catch (e) {
                        output += `<pre>${value}</pre>`;
                    }
                } else {
                    output += `<p>${key}: <strong>NOT FOUND</strong></p>`;
                }
            });

            // Check last sync time
            const lastSync = localStorage.getItem('github_last_sync');
            if (lastSync) {
                const date = new Date(parseInt(lastSync));
                const minutesAgo = Math.floor((Date.now() - parseInt(lastSync)) / 60000);
                output += `<p><strong>Last Sync:</strong> ${date.toLocaleString()} (${minutesAgo} minutes ago)</p>`;
            }

            document.getElementById('output').innerHTML = output;
        }

        function clearCache() {
            const keys = [
                'github_profile',
                'github_repos',
                'github_languages',
                'github_stats',
                'github_contributions',
                'github_last_sync',
                'github_sync_status'
            ];

            keys.forEach(key => localStorage.removeItem(key));
            alert('Cache cleared! Refresh your portfolio to re-fetch data.');
            viewCache();
        }

        function checkEnv() {
            let output = '<h2>Environment Check:</h2>';
            output += '<p>Note: Environment variables are only available during build time, not in browser.</p>';
            output += `<p>Origin: ${window.location.origin}</p>`;
            output += `<p>LocalStorage Available: ${typeof localStorage !== 'undefined' ? 'Yes ✓' : 'No ✗'}</p>`;
            output += `<p>BroadcastChannel Available: ${typeof BroadcastChannel !== 'undefined' ? 'Yes ✓' : 'No ✗'}</p>`;

            document.getElementById('output').innerHTML = output;
        }

        // Auto-view on load
        viewCache();
    </script>
</body>
</html>
